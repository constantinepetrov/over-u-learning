name: OVER U isolated integration

on:
  push:
    branches: [feature/overu-brand-design]
  pull_request:
    branches: [feature/overu-brand-design]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: over-u-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: github.ref == 'refs/heads/feature/overu-brand-design' || github.base_ref == 'feature/overu-brand-design'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/lms
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: develop
          path: apps/frappe
          sparse-checkout: ui
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend dependencies
        working-directory: apps/lms/frontend
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run frontend unit tests
        working-directory: apps/lms/frontend
        run: yarn test
      - name: Provide minimal bench socket config for the frontend build
        run: |
          mkdir -p sites
          printf '{"socketio_port":9000}\n' > sites/common_site_config.json
      - name: Build LMS frontend
        working-directory: apps/lms/frontend
        run: yarn build


  server:
    if: github.ref == 'refs/heads/feature/overu-brand-design' || github.base_ref == 'feature/overu-brand-design'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check ephemeral runner capacity
        run: |
          df -h /
          free -h
          available_gib=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$available_gib" -lt 8 ]; then
            echo "Runner has less than 8 GiB free; refusing the Frappe build to avoid a predictable disk exhaustion."
            exit 1
          fi
      - name: Configure temporary synthetic credentials
        run: |
          db_password=$(openssl rand -hex 24)
          admin_password=$(openssl rand -hex 24)
          demo_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$demo_password"
          {
            echo "OVER_U_DB_PASSWORD=$db_password"
            echo "OVER_U_ADMIN_PASSWORD=$admin_password"
            echo "OVER_U_DEMO_PASSWORD=$demo_password"
            echo "OVER_U_CA_BUNDLE=$GITHUB_WORKSPACE/over-u/dev/.ci-ca-bundle.pem"
          } >> "$GITHUB_ENV"
          cp /etc/ssl/certs/ca-certificates.crt over-u/dev/.ci-ca-bundle.pem
      - name: Build isolated Frappe test image
        run: docker compose -p over-u-ci -f over-u/dev/compose.yml build frappe
      - name: Grant the isolated Frappe user access to its bind mount
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      - name: Start disposable test site
        env:
          GIT_TRACE: 0
          GIT_TERMINAL_PROMPT: 0
        run: docker compose -p over-u-ci -f over-u/dev/compose.yml up -d
      - name: Wait for Frappe and verify /lms assets
        timeout-minutes: 35
        run: |
          echo "127.0.0.1 over-u.localhost" | sudo tee -a /etc/hosts >/dev/null
          ready=0
          for attempt in $(seq 1 210); do
            if curl --silent --fail --header 'Host: over-u.localhost' http://127.0.0.1:8000/api/method/ping >/dev/null; then
              ready=1
              break
            fi
            container_id=$(docker compose -p over-u-ci -f over-u/dev/compose.yml ps --all -q frappe)
            if [ -n "$container_id" ] && [ "$(docker inspect -f '{{.State.Status}}' "$container_id")" = "exited" ]; then
              docker compose -p over-u-ci -f over-u/dev/compose.yml ps --all
              docker compose -p over-u-ci -f over-u/dev/compose.yml logs --no-color --tail 250 frappe mariadb
              exit 1
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -p over-u-ci -f over-u/dev/compose.yml ps
            docker compose -p over-u-ci -f over-u/dev/compose.yml logs --no-color --tail 100 frappe mariadb
            exit 1
          fi
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8000"
          class Assets(HTMLParser):
            def __init__(self):
              super().__init__()
              self.urls = []
            def handle_starttag(self, tag, attrs):
              attrs = dict(attrs)
              if tag == "script" and attrs.get("src"):
                self.urls.append(attrs["src"])
              if tag == "link" and attrs.get("href") and "stylesheet" in attrs.get("rel", ""):
                self.urls.append(attrs["href"])

          request = Request(base + "/lms", headers={"Host": "over-u.localhost"})
          with urlopen(request, timeout=30) as response:
            assert response.status == 200, f"/lms returned {response.status}"
            html = response.read().decode("utf-8", "replace")
          assert 'id="app"' in html, "/lms shell is missing its Vue mount"
          parser = Assets()
          parser.feed(html)
          assert parser.urls, "/lms shell did not reference built JavaScript or CSS"
          for path in parser.urls:
            if path.startswith(("http://", "https://")):
              continue
            asset = path if path.startswith("/") else "/" + path
            asset_request = Request(base + asset, headers={"Host": "over-u.localhost"})
            with urlopen(asset_request, timeout=30) as response:
              assert response.status == 200, f"asset {asset} returned {response.status}"
          print(f"/lms returned 200 and {len(parser.urls)} frontend assets returned 200")
          PY
      - name: Install isolated browser smoke-test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/over-u-playwright" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.0
          "$RUNNER_TEMP/over-u-playwright/node_modules/.bin/playwright" install chromium
      - name: Check /lms runtime console in Chromium
        run: |
          node --input-type=module <<'JS'
          import { pathToFileURL } from 'node:url'
          const { chromium } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/over-u-playwright/node_modules/playwright/index.mjs`))
          const browser = await chromium.launch({ headless: true })
          const context = await browser.newContext()
          const login = await context.request.post('http://over-u.localhost:8000/api/method/login', {
            form: { usr: 'Administrator', pwd: process.env.OVER_U_ADMIN_PASSWORD },
          })
          if (login.status() !== 200 || (await login.json()).message !== 'Logged In') {
            throw new Error('Synthetic administrator login failed')
          }
          const page = await context.newPage()
          const errors = []
          page.on('pageerror', error => errors.push(error.message))
          page.on('console', message => { if (message.type() === 'error') errors.push(message.text()) })
          const response = await page.goto('http://over-u.localhost:8000/lms', { waitUntil: 'networkidle', timeout: 60000 })
          if (!response || response.status() !== 200) errors.push(`/lms response status: ${response?.status()}`)
          await page.waitForTimeout(2000)
          const mounted = await page.locator('#app').count()
          if (!mounted) errors.push('Vue app mount not found')
          await browser.close()
          if (errors.length) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          console.log('/lms loaded in Chromium without JavaScript console or page errors')
          JS
      - name: Check direct private assignment-file access
        run: |
          PROBE_JSON="$(docker compose -p over-u-ci -f over-u/dev/compose.yml exec -T frappe bash -lc 'cd /home/frappe/frappe-bench && bench --site over-u.localhost execute over_u.ci_probe.create_private_assignment_file_probe')"
          printf '%s\n' "$PROBE_JSON"
          export OVER_U_CI_PROBE="$PROBE_JSON"
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import HTTPCookieProcessor, HTTPRedirectHandler, Request, build_opener

          BASE = "http://over-u.localhost:8000"
          FILE = BASE + "/private/files/over-u-ci-private-attachment.txt"
          SENTINEL = b"OVER_U_SYNTHETIC_PRIVATE_ATTACHMENT"
          PROBE = json.loads(os.environ["OVER_U_CI_PROBE"])

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          def opener():
              return build_opener(HTTPCookieProcessor(http.cookiejar.CookieJar()), NoRedirect)

          def get(client):
              try:
                  with client.open(Request(FILE), timeout=30) as response:
                      return response.status, response.read()
              except HTTPError as error:
                  return error.code, error.read()

          def api(client, method, **params):
              data = urlencode({key: json.dumps(value) if isinstance(value, (dict, list)) else value for key, value in params.items()}).encode()
              request = Request(BASE + "/api/method/" + method, data=data)
              try:
                  with client.open(request, timeout=30) as response:
                      return response.status, json.loads(response.read())
              except HTTPError as error:
                  return error.code, json.loads(error.read())

          guest_status, guest_body = get(opener())
          assert guest_status != 200 and SENTINEL not in guest_body, f"Guest received the private attachment (HTTP {guest_status})"

          def login(user):
              client = opener()
              data = urlencode({"usr": user, "pwd": os.environ["OVER_U_DEMO_PASSWORD"]}).encode()
              with client.open(Request(BASE + "/api/method/login", data=data), timeout=30) as response:
                  assert response.status == 200, f"Synthetic login failed for {user}"
              return client

          outsider_status, outsider_body = get(login("student2@over-u.example.com"))
          assert outsider_status != 200 and SENTINEL not in outsider_body, f"Another student received the private attachment (HTTP {outsider_status})"

          owner_status, owner_body = get(login("student1@over-u.example.com"))
          assert owner_status == 200 and SENTINEL in owner_body, f"Owner could not download their attachment (HTTP {owner_status})"

          teacher_status, teacher_body = get(login("teacher@over-u.example.com"))
          assert teacher_status == 200 and SENTINEL in teacher_body, f"Course teacher could not review the attachment (HTTP {teacher_status})"
          print("Direct attachment URL denied to Guest and another student, allowed to owner and course teacher")

          owner = login("student1@over-u.example.com")
          outsider = login("student2@over-u.example.com")
          teacher = login("teacher@over-u.example.com")
          status, owner_rows = api(owner, "frappe.client.get_list", doctype="LMS Assignment Submission", fields=["name"], limit_page_length=100)
          assert status == 200, f"Owner could not list submissions (HTTP {status})"
          submission_name = PROBE["submission"]
          owner_list_visible = any(item.get("name") == submission_name for item in owner_rows.get("message", []))
          status, owner_submission = api(owner, "frappe.client.get", doctype="LMS Assignment Submission", name=submission_name)
          assert status == 200 and owner_submission.get("message", {}).get("assignment_attachment") == "/private/files/over-u-ci-private-attachment.txt", f"Owner could not read their submission through frappe.client.get (HTTP {status})"

          status, outsider_rows = api(outsider, "frappe.client.get_list", doctype="LMS Assignment Submission", fields=["name"], limit_page_length=100)
          assert status == 200 and all(item.get("name") != submission_name for item in outsider_rows.get("message", [])), "Another student listed the owner's submission"
          status, outsider_doc = api(outsider, "frappe.client.get", doctype="LMS Assignment Submission", name=submission_name)
          assert status != 200 and SENTINEL.decode() not in json.dumps(outsider_doc), "Another student read the owner's submission through frappe.client.get"

          for label, client in (("owner", owner), ("course teacher", teacher)):
              status, submission = api(client, "frappe.client.get", doctype="LMS Assignment Submission", name=submission_name)
              assert status == 200 and submission.get("message", {}).get("assignment_attachment") == "/private/files/over-u-ci-private-attachment.txt", f"{label} could not read the submission through frappe.client.get (HTTP {status})"

          file_name = PROBE["file_name"]
          status, file_rows = api(owner, "frappe.client.get_list", doctype="File", fields=["name"], limit_page_length=100)
          assert status == 200, f"Owner could not list File documents (HTTP {status})"
          owner_file_list_visible = any(item.get("name") == file_name for item in file_rows.get("message", []))
          status, outsider_files = api(outsider, "frappe.client.get_list", doctype="File", fields=["name"], limit_page_length=100)
          assert status == 200 and all(item.get("name") != file_name for item in outsider_files.get("message", [])), "Another student listed the owner's private File document"
          status, outsider_file = api(outsider, "frappe.client.get", doctype="File", name=file_name)
          assert status != 200 and SENTINEL.decode() not in json.dumps(outsider_file), "Another student read the private File document through frappe.client.get"
          for label, client in (("owner", owner), ("course teacher", teacher)):
              status, file_doc = api(client, "frappe.client.get", doctype="File", name=file_name)
              assert status == 200 and file_doc.get("message", {}).get("file_url") == "/private/files/over-u-ci-private-attachment.txt", f"{label} could not read the File document through frappe.client.get (HTTP {status})"
          print(f"frappe.client.get denies cross-student submission and File reads; owner and course teacher retain access. Owner list visibility: submission={owner_list_visible}, file={owner_file_list_visible}")
          PY
          docker compose -p over-u-ci -f over-u/dev/compose.yml exec -T frappe bash -lc 'cd /home/frappe/frappe-bench && bench --site over-u.localhost execute over_u.ci_probe.cleanup_private_assignment_file_probe'
      - name: Run synthetic Frappe integration and privacy tests
        run: |
          docker compose -p over-u-ci -f over-u/dev/compose.yml exec -T frappe bash -lc 'cd /home/frappe/frappe-bench && bench --site over-u.localhost run-tests --module over_u.test_student_api'
          docker compose -p over-u-ci -f over-u/dev/compose.yml exec -T frappe bash -lc 'cd /home/frappe/frappe-bench && bench --site over-u.localhost run-tests --module over_u.test_desk_users'
          # The single upstream same-transaction upload test passes its assertions but
          # Frappe's rollback callback then tries to move a file already removed by its
          # earlier insert callback. The HTTP probe above exercises the same access matrix
          # against the running app without that test-fixture teardown defect.
          docker compose -p over-u-ci -f over-u/dev/compose.yml exec -T frappe bash -lc 'cd /home/frappe/frappe-bench && bench --site over-u.localhost run-tests --module lms.lms.doctype.lms_assignment_submission.test_lms_assignment_submission --test test_a_phishing_form_in_comments_is_not_stored --test test_a_phishing_form_in_the_answer_is_not_stored --test test_every_form_control_tag_is_stripped --test test_legitimate_rich_text_survives --test test_privileged_user_can_act_on_behalf_of_member --test test_privileged_user_can_reassign_member_on_update --test test_sanitizing_the_same_value_twice_does_not_change_it --test test_script_iframe_and_event_handlers_are_still_stripped --test test_shared_public_files_are_not_made_private_as_a_side_effect --test test_student_cannot_act_for_another_member --test test_student_cannot_attach_another_students_file --test test_student_cannot_reassign_member_on_update --test test_student_member_defaults_to_or_matches_session_user --test test_submission_attachments_are_not_configured_as_public'
      - name: Report container resource use
        if: always()
        run: |
          docker compose -p over-u-ci -f over-u/dev/compose.yml ps --all || true
          docker stats --no-stream || true
          df -h / || true
      - name: Stop and remove only this job's containers and volumes
        if: always()
        run: docker compose -p over-u-ci -f over-u/dev/compose.yml down --volumes --remove-orphans || true
      - name: Remove temporary CA copy
        if: always()
        run: sudo rm -f over-u/dev/.ci-ca-bundle.pem

name: Semantic Pull Request

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  semantic:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re

          title = os.environ["PR_TITLE"]
          pattern = r"(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([a-zA-Z0-9_.-]+\))?!?: .+"
          if not re.fullmatch(pattern, title):
              raise SystemExit(
                  "PR title must follow Conventional Commits, e.g. 'feat: improve school navigation'."
              )
          print("Conventional Commit PR title verified")
          PY
